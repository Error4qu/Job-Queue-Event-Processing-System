
services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: jobdb
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jobdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      REDIS_HOST: redis
      REDIS_PORT: 6379

      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-in-production}
      INCIDENT_PUBLISHER_ENABLED: "true"

      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

  ai-agent:
    profiles:
      - ai
    build:
      context: .
      dockerfile: ai-agent/Dockerfile
    depends_on:
      app:
        condition: service_started
      kafka:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      JOB_QUEUE_BASE_URL: http://app:8080
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-in-production}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AUTO_EXECUTE: ${AUTO_EXECUTE:-true}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.75}
      DRY_RUN: ${DRY_RUN:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  log-bridge:
    profiles:
      - ai
    build:
      context: .
      dockerfile: log-bridge/Dockerfile
    depends_on:
      ai-agent:
        condition: service_healthy
    environment:
      AI_AGENT_URL: http://ai-agent:8090
    volumes:
      - ./self-healer/examples/sample.txt:/logs/sample.txt:ro

  self-healer:
    profiles:
      - self-healer
    build:
      context: ./self-healer
    depends_on:
      app:
        condition: service_started
    command: ["--help"]
